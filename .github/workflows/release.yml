name: Crear release

# Al subir una etiqueta vX.Y.Z se crea el release con sus notas (del CHANGELOG)
# y un .zip del sitio, que sirve como respaldo para regresar a esa versión.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar que version.js coincide con la etiqueta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(sed -n "s/.*APP_VERSION = '\(.*\)'.*/\1/p" version.js)
          echo "Etiqueta: $TAG · version.js: $FILE"
          test "$TAG" = "$FILE" || { echo "::error::version.js dice $FILE pero la etiqueta es v$TAG"; exit 1; }
      - name: Notas desde el CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '
            index($0, "## [" v "]") == 1 { on=1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Versión $TAG" > notes.md
          cat notes.md
      - name: Paquete del sitio
        run: |
          bash scripts/build-site.sh "${GITHUB_REF_NAME}"
          (cd _site && zip -r "../aperturas-${GITHUB_REF_NAME}.zip" .)
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "aperturas-${GITHUB_REF_NAME}.zip" \
            --title "Aperturas ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
